name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/PinScheduler-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PinScheduler-apk
          path: out/*.apk
          retention-days: 30

      # Publishes each build as a GitHub Release so the APK can be downloaded
      # from github.com/mnameerturk/auto-pinterest-app/releases/latest on a phone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Pin Scheduler v1.0.${{ github.run_number }}
          body: Download the .apk below and open it on your Android phone to install or update.
          files: out/*.apk
          make_latest: true
